[project]
name = "vgate"
version = "0.1.1"
description = "ACDC Presentation Handler library"
readme = "README.md"
authors = [
    { name = "Kevin Griffin", email = "kevin.griffin@gleif.org" }
]
requires-python = ">=3.12.6"
dependencies = [
    "keri>=1.2.7,<1.3.0",
    "hio>=0.6.14,<0.6.18",
    "falcon>=3.1.3",
    "http-sfv>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "mockito>=1.5.4",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]
